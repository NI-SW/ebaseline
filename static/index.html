<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ebaseline - 智能体基线测试系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }
a { color: #1890ff; text-decoration: none; }
button { cursor: pointer; }

/* ── 布局 ── */
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: #001529; color: #fff; padding: 0; flex-shrink: 0; }
.sidebar .logo { padding: 20px; font-size: 18px; font-weight: 600; border-bottom: 1px solid #ffffff22; }
.sidebar .logo small { display: block; font-size: 12px; font-weight: 400; color: #ffffff88; margin-top: 4px; }
.sidebar nav a { display: block; padding: 12px 20px; color: #ffffffb3; font-size: 14px; }
.sidebar nav a:hover, .sidebar nav a.active { background: #1890ff; color: #fff; }
.main { flex: 1; min-width: 0; padding: 24px; overflow-x: auto; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.topbar h1 { font-size: 20px; }
.topbar .user { font-size: 14px; color: #666; }
.topbar .user button { margin-left: 12px; }

/* ── 卡片/表格 ── */
.card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 2px #0001; margin-bottom: 16px; }
.card h2 { font-size: 16px; margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
th { background: #fafafa; font-weight: 600; white-space: nowrap; }
tr:hover td { background: #fafcff; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.tag-blue { background: #e6f7ff; color: #1890ff; }
.tag-green { background: #f6ffed; color: #52c41a; }
.tag-red { background: #fff2f0; color: #ff4d4f; }
.tag-orange { background: #fff7e6; color: #fa8c16; }
.tag-gray { background: #f5f5f5; color: #999; }

/* ── 按钮/表单 ── */
.btn { border: none; border-radius: 4px; padding: 6px 14px; font-size: 13px; background: #1890ff; color: #fff; }
.btn:hover { background: #40a9ff; }
.btn-sm { padding: 3px 10px; font-size: 12px; }
.btn-default { background: #fff; color: #333; border: 1px solid #d9d9d9; }
.btn-danger { background: #ff4d4f; }
.btn-success { background: #52c41a; }
input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; font-family: inherit; }
input:focus, textarea:focus { border-color: #1890ff; outline: none; }
.form-item { margin-bottom: 16px; }
.form-item label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }

/* ── 登录页 ── */
.login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #001529 0%, #003a8c 100%); }
.login-box { background: #fff; border-radius: 12px; padding: 40px; width: 380px; box-shadow: 0 8px 30px #0003; }
.login-box h1 { font-size: 24px; text-align: center; margin-bottom: 8px; }
.login-box .sub { text-align: center; color: #999; font-size: 13px; margin-bottom: 30px; }
.login-box .btn { width: 100%; padding: 10px; font-size: 15px; }

/* ── 弹窗 ── */
.modal-mask { position: fixed; inset: 0; background: #00000066; display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: #fff; border-radius: 8px; padding: 24px; width: 560px; max-height: 85vh; overflow-y: auto; }
.modal h3 { margin-bottom: 20px; }
.modal .footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* ── 消息 ── */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; color: #fff; z-index: 999; font-size: 14px; box-shadow: 0 4px 12px #0002; }
.toast.success { background: #52c41a; }
.toast.error { background: #ff4d4f; }

/* ── 日志 ── */
.log-view { background: #001529; color: #a6ffb8; padding: 16px; border-radius: 6px; font-family: "SF Mono", Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 500px; overflow-y: auto; }
.detail-grid { display: grid; grid-template-columns: 100px 1fr; gap: 8px 16px; font-size: 14px; }
.detail-grid dt { color: #999; }
.detail-grid dd { word-break: break-all; }
.mono { font-family: Consolas, monospace; font-size: 13px; }
/* ── 批次指标 ── */
.metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.metric { background: #fafafa; border: 1px solid #f0f0f0; border-radius: 6px; padding: 12px 14px; }
.metric .label { font-size: 12px; color: #999; }
.metric .value { font-size: 20px; font-weight: 600; margin-top: 4px; color: #262626; }
.metric .sub { font-size: 11px; color: #999; margin-top: 2px; }
.page-sub { font-size: 12px; font-weight: 400; color: #999; margin-left: 8px; }
/* ── 批次按任务组折叠 ── */
.batch-group { background: #fff; border: 1px solid transparent; border-radius: 8px; box-shadow: 0 1px 2px #0001; margin-bottom: 14px; overflow: hidden; }
.batch-group.open { border-color: #e6f4ff; }
.batch-group-head { padding: 14px 18px 12px; cursor: pointer; user-select: none; }
.batch-group-head:hover { background: #fafcff; }
.batch-group-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.batch-group-title .chevron { width: 12px; flex-shrink: 0; color: #8c8c8c; font-size: 11px; transition: transform .18s ease; }
.batch-group.open .batch-group-title .chevron { transform: rotate(90deg); }
.batch-group-title .name { font-size: 16px; font-weight: 600; color: #262626; }
.batch-group-title .gid { font-family: Consolas, monospace; font-size: 12px; color: #bfbfbf; }
.batch-group-title .latest { margin-left: auto; color: #999; font-size: 12px; white-space: nowrap; }
.batch-group-metrics { display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 12px; padding-left: 22px; }
.bg-metric .label { color: #999; font-size: 11px; white-space: nowrap; }
.bg-metric .value { margin-top: 1px; color: #262626; font-size: 16px; font-weight: 600; white-space: nowrap; }
.bg-metric .value.good { color: #52c41a; }
.bg-metric .value.warn { color: #fa8c16; }
.bg-metric .value.bad { color: #ff4d4f; }
.bg-metric .sub { margin-top: 1px; color: #c0c0c0; font-size: 10px; white-space: nowrap; }
.batch-group-body { border-top: 1px solid #f0f0f0; padding: 4px 18px 12px; }
.batch-group-body table th { background: #fafafa; }
.table-wrap { overflow-x: auto; }
/* ── 固定列宽 / 右侧操作列 ── */
.fixed-table { table-layout: fixed; border-collapse: separate; border-spacing: 0; line-height: 1.5; }
.batch-results-table { min-width: 1240px; }
.task-list-table { min-width: 1120px; }
.fixed-table th, .fixed-table td { padding: 10px 8px; overflow-wrap: anywhere; }
.fixed-table th { white-space: normal; }
.fixed-table .tag, .fixed-table .btn { white-space: nowrap; }
.fixed-table .table-actions { position: sticky; right: 0; z-index: 1; background: #fff; box-shadow: -4px 0 6px -4px #0003; }
.fixed-table th.table-actions { z-index: 2; background: #fafafa; }
.fixed-table tr:hover td.table-actions { background: #fafcff; }
.fixed-table .table-actions .flex { flex-wrap: nowrap; gap: 6px; }
.fixed-table .table-actions .btn { flex-shrink: 0; }
.flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.flex-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
/* ── 全屏日志查看器 ── */
.fullscreen-log { position: fixed; inset: 0; background: #0d1117; z-index: 200; display: flex; flex-direction: column; }
.fullscreen-log .log-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; }
.fullscreen-log .log-header h3 { color: #e6edf3; font-size: 15px; }
.fullscreen-log .log-header .meta { color: #8b949e; font-size: 13px; margin-left: 16px; }
.fullscreen-log .log-header .actions { display: flex; gap: 8px; }
.fullscreen-log .log-body { flex: 1; overflow-y: auto; padding: 20px; }
.fullscreen-log .log-content { color: #a6ffb8; font-family: "SF Mono", Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; margin: 0; }
.fullscreen-log .log-status { padding: 8px 20px; background: #161b22; border-top: 1px solid #30363d; font-size: 12px; color: #8b949e; display: flex; justify-content: space-between; flex-shrink: 0; }
.fullscreen-log .log-status .live { color: #3fb950; }
.fullscreen-log .log-status .live::before { content: '●'; margin-right: 6px; animation: blink 1.5s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.btn-log { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
.btn-log:hover { background: #30363d; }

/* ── 工作空间（VS Code 风格）── */
.ws-layout { display: flex; height: 100vh; background: #1e1e1e; overflow: hidden; }
.ws-sidebar { width: 240px; background: #252526; color: #ccc; display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid #1a1a1a; }
.ws-sidebar .ws-side-header { padding: 10px 12px; font-size: 12px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
.ws-sidebar .ws-side-header .ops button { background: none; border: none; color: #999; font-size: 14px; padding: 2px 6px; border-radius: 3px; }
.ws-sidebar .ws-side-header .ops button:hover { background: #3c3c3c; color: #fff; }
.ws-tree { flex: 1; overflow-y: auto; font-size: 13px; padding: 4px 0; }
.ws-tree .tree-item { padding: 4px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.ws-tree .tree-item:hover { background: #2a2d2e; }
.ws-tree .tree-item.active { background: #37373d; color: #fff; }
.ws-tree .tree-item .icon { width: 16px; text-align: center; }
.ws-tree .tree-item.dir { color: #dcb67a; }
.ws-tree .tree-item .size { margin-left: auto; color: #666; font-size: 11px; }
.ws-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.ws-editor-head { background: #252526; padding: 8px 16px; font-size: 13px; color: #ccc; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
.ws-editor-head .path { font-family: Consolas, monospace; }
.ws-editor-head .dirty { color: #e5c07b; margin-left: 8px; }
.ws-editor { flex: 1; min-height: 0; overflow: hidden; }
.ws-editor textarea { width: 100%; height: 100%; background: #1e1e1e; color: #d4d4d4; border: none; outline: none; resize: none; padding: 16px; font-family: "SF Mono", Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.6; tab-size: 4; }
.ws-welcome { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; flex-direction: column; gap: 12px; }
.ws-terminal-wrap { height: 280px; max-height: 50vh; background: #0c0c0c; border-top: 1px solid #30363d; display: flex; flex-direction: column; flex-shrink: 0; }
.ws-terminal-wrap.collapsed { height: 32px; max-height: 32px; }
.ws-terminal-wrap.collapsed #ws-terminal { display: none; }
.ws-term-header { padding: 6px 12px; font-size: 12px; color: #999; background: #161b22; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.ws-term-header .ops button { background: none; border: none; color: #999; cursor: pointer; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
.ws-term-header .ops button:hover { background: #30363d; color: #fff; }
#ws-terminal { flex: 1; min-height: 0; overflow: hidden; padding: 4px 8px; }
#ws-terminal .xterm { height: 100%; }
.ws-statusbar { height: 24px; background: #007acc; color: #fff; font-size: 12px; display: flex; align-items: center; padding: 0 12px; gap: 16px; flex-shrink: 0; }
.ws-statusbar .right { margin-left: auto; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>

<body>
<div id="app"></div>

<script>
/* ═══════════════════════ 工具 ═══════════════════════ */
const $ = sel => document.querySelector(sel);
const state = { token: localStorage.getItem('eb_token'), user: null, page: 'groups', detail: null };

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = typeof msg === 'string' ? msg : (JSON.stringify(msg) ?? String(msg));
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// FastAPI 校验错误（422）的 detail 是数组，直接塞进 Error 会变成 "[object Object]"
function formatApiDetail(detail) {
  if (detail === null || detail === undefined || detail === '') return '';
  if (typeof detail === 'string') return detail;
  if (Array.isArray(detail)) return detail.map(formatApiDetail).filter(Boolean).join('；');
  if (typeof detail === 'object') {
    if (detail.msg) {
      const loc = Array.isArray(detail.loc) ? detail.loc.filter(x => x !== 'body').join('.') : '';
      return loc ? `${loc}: ${detail.msg}` : detail.msg;
    }
    return detail.message || JSON.stringify(detail);
  }
  return String(detail);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(state.token ? { 'Authorization': `Bearer ${state.token}` } : {}),
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) { logout(); throw new Error('未登录'); }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(formatApiDetail(data?.detail) || `HTTP ${res.status}`);
  return data;
}

function logout() {
  localStorage.removeItem('eb_token');
  state.token = null; state.user = null;
  render();
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 把任意 JS 参数安全嵌入双引号 onclick 属性：
// 先 JSON.stringify（处理引号/换行），再做 HTML 实体转义（处理属性边界）
function jsArg(...args) {
  return args.map(a => JSON.stringify(a)).join(', ')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const BATCH_STATUS = { 0: ['未执行','tag-gray'], 1: ['执行中','tag-blue'], 2: ['已完成','tag-green'], 3: ['执行失败','tag-red'], 4: ['部分成功','tag-orange'] };
const RESULT_TEXT = { 0: ['未执行','tag-gray'], 1: ['成功','tag-green'], 2: ['失败','tag-red'], 3: ['执行中','tag-blue'] };
// 任务细分结果（从 process 中解析 result_detail）
const RESULT_DETAIL = { 2: ['成功','tag-green'], 1: ['校验通过(Agent异常)','tag-orange'], 0: ['失败','tag-red'] };
// 五态判定
const VERDICT = {
  PASS: ['通过','tag-green'],
  PARTIAL: ['部分通过','tag-orange'],
  FAIL: ['失败','tag-red'],
  SKIP: ['跳过','tag-gray'],
  ERROR: ['异常','tag-red'],
  RUNNING: ['执行中','tag-blue'],
  PENDING: ['未执行','tag-gray'],
};

function verdictTag(v) {
  const [txt, cls] = VERDICT[v] || ['未知','tag-gray'];
  return `<span class="tag ${cls}">${txt}</span>`;
}

function fmtInt(v) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  return Math.round(Number(v)).toLocaleString('zh-CN');
}

function fmtNum(v, digits = 1) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  return Number(v).toFixed(digits);
}

function fmtSec(v) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  return Number(v).toFixed(1) + 's';
}

function fmtTok(v) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  const n = Number(v);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(Math.round(n));
}

function fmtMs(v) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  const n = Number(v);
  return n >= 1000 ? (n / 1000).toFixed(1) + 's' : Math.round(n) + 'ms';
}

function fmtPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  return (Number(v) * 100).toFixed(1) + '%';
}

function metricCard(label, value, sub = '', title = '') {
  return `<div class="metric"${title ? ` title="${esc(title)}"` : ''}>
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div>`;
}

function resultTag(r) {
  if (r && r.verdict) return verdictTag(r.verdict);
  const [rt, rc] = getResultTag(r?.result ?? 0, r?.process);
  return `<span class="tag ${rc}">${rt}</span>`;
}

function parseResultDetail(process) {
  if (!process) return null;
  const m = process.match(/=== 任务 \d+ (成功|校验通过\(Agent异常\)|失败) ===/);
  if (!m) return null;
  const map = { '成功': 2, '校验通过(Agent异常)': 1, '失败': 0 };
  return map[m[1]] ?? null;
}

function getResultTag(result, process) {
  // 执行中状态直接显示
  if (result === 3) return RESULT_TEXT[3];
  const detail = parseResultDetail(process);
  if (detail !== null) return RESULT_DETAIL[detail];
  return RESULT_TEXT[result] || ['未知', 'tag-gray'];
}

/* ═══════════════════════ 登录页 ═══════════════════════ */
function renderLogin() {
  $('#app').innerHTML = `
  <div class="login-page"><div class="login-box">
    <h1>ebaseline</h1>
    <div class="sub">智能体基线测试系统</div>
    <div class="form-item"><label>用户名</label><input id="l_user" value="admin"></div>
    <div class="form-item"><label>密码</label><input id="l_pass" type="password" value=""></div>
    <button class="btn" onclick="doLogin()">登 录</button>
  </div></div>`;
  $('#l_pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  try {
    const r = await api('/api/v1/auth/login', { method: 'POST',
      body: JSON.stringify({ username: $('#l_user').value, password: $('#l_pass').value }) });
    state.token = r.access_token;
    localStorage.setItem('eb_token', r.access_token);
    state.user = await api('/api/v1/auth/me');
    // 登录后恢复到 URL hash 指向的页面（刷新/会话过期重新登录时保持上下文）
    if (location.hash && location.hash !== '#' && location.hash !== '#/') await loadRoute();
    else navigate('groups', true);
  } catch (e) { toast(e.message, 'error'); }
}

/* ═══════════════════════ 主框架 ═══════════════════════ */
const PAGES = [
  ['groups', '任务组'],
  ['subjects', '待测主体'],
  ['batches', '测试批次'],
  ['results', '执行结果'],
];

function render() {
  if (!state.token) return renderLogin();
  document.body.style.overflow = '';
  if (state.page === 'workspace') return renderWorkspaceFull();
  $('#app').innerHTML = `
  <div class="layout">
    <div class="sidebar">
      <div class="logo">ebaseline<small>智能体基线测试系统</small></div>
      <nav>${PAGES.map(([k, n]) => `<a class="${state.page === k || (k === 'groups' && state.page === 'tasks') ? 'active' : ''}" onclick="goto('${k}')">${n}</a>`).join('')}</nav>
    </div>
    <div class="main">
      <div class="topbar">
        <h1 id="page-title"></h1>
        <div class="user">${esc(state.user?.username)}（${['普通用户','管理员','超管'][state.user?.privilege] ?? ''}）<button class="btn btn-default btn-sm" onclick="logout()">退出</button></div>
      </div>
      <div id="content"></div>
    </div>
  </div>`;
  loadPage();
}

function goto(p) {
  navigate(p);
}

/* ═══════════════════════ 路由（URL hash，刷新/后退保持当前页面）═══════════════════════ */
const TOP_PAGES = ['groups', 'subjects', 'batches', 'results'];

// #/groups | #/subjects | #/batches | #/results
// #/tasks/<gid> | #/workspace/<gid>
// #/batch/<bid>（返回测试批次）| #/result/<bid>（返回执行结果）
function parseRoute() {
  const parts = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  const name = parts[0] || 'groups';
  const id = /^\d+$/.test(parts[1] || '') ? Number(parts[1]) : null;
  if (name === 'tasks' && id) return { page: 'tasks', id };
  if (name === 'workspace' && id) return { page: 'workspace', id };
  if (name === 'batch' && id) return { page: 'batches', id };
  if (name === 'result' && id) return { page: 'results', id };
  if (TOP_PAGES.includes(name)) return { page: name, id: null };
  return { page: 'groups', id: null };
}

function navigate(path, replace = false) {
  const hash = '#/' + path;
  if (location.hash === hash) { loadRoute(); return; }
  if (replace) { history.replaceState(null, '', hash); loadRoute(); }
  else location.hash = hash;
}

async function loadRoute() {
  if (!state.token) return renderLogin();
  const r = parseRoute();
  // 清理上一页面遗留的定时器 / 工作空间连接
  if (_batchDetailTimer) { clearInterval(_batchDetailTimer); _batchDetailTimer = null; }
  if (state.page === 'workspace' && r.page !== 'workspace') closeWorkspace();
  if (r.page === 'workspace' && _wsGid !== r.id) {
    _wsGid = r.id; _wsGname = ''; _wsPath = ''; _wsFile = null; _wsDirty = false;
    try {
      const g = await api(`/api/v1/groups/${r.id}`);
      _wsGname = g.name;
    } catch (e) { toast(e.message, 'error'); navigate('groups', true); return; }
  }
  state.page = r.page;
  state.detail = r.id;
  render();
}

async function loadPage() {
  const { page, detail } = state;
  if (page === 'tasks') return pageTasks(detail);
  if ((page === 'batches' || page === 'results') && detail) return batchDetail(detail, page);
  const fn = { groups: pageGroups, subjects: pageSubjects, batches: pageBatches, results: pageResults }[page];
  if (fn) await fn();
}

/* ═══════════════════════ 批次 ═══════════════════════ */
let _batchDetailTimer = null;
let _batchDetailData = null;   // 当前批次详情（单任务执行时用于检查依赖）
let _batchTaskStartedAt = 0;   // 单任务启动时间（等待后台写入“执行中”记录）
let _batchGroupGids = [];      // 当前批次页的任务组 gid（全部展开/折叠用）
const _batchGroupOpen = new Set();  // 展开的任务组 gid（跨列表刷新保留）

function _metricNum(b, key) {
  const v = b?.metrics?.[key];
  return (v === null || v === undefined || isNaN(v)) ? null : Number(v);
}

function _sumMetric(items, key) {
  return items.reduce((acc, b) => acc + (_metricNum(b, key) || 0), 0);
}

/** 按各批次的样本数加权求均值（批次 API 只提供均值+样本数，无法直接合并原始值）。 */
function _weightedMetric(items, valueKey, sampleKey) {
  let total = 0, samples = 0;
  for (const b of items) {
    const value = _metricNum(b, valueKey);
    const weight = _metricNum(b, sampleKey) || 0;
    if (value === null || weight <= 0) continue;
    total += value * weight;
    samples += weight;
  }
  return { value: samples ? total / samples : null, samples };
}

function _rateClass(v) {
  if (v === null || v === undefined || isNaN(v)) return '';
  return v >= 0.8 ? 'good' : v >= 0.5 ? 'warn' : 'bad';
}

function _bgMetric(label, value, sub = '', title = '', cls = '') {
  return `<div class="bg-metric"${title ? ` title="${esc(title)}"` : ''}>
    <div class="label">${label}</div>
    <div class="value${cls ? ' ' + cls : ''}">${value}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div>`;
}

/** 汇总同一任务组下所有批次的指标。通过率按结果条数累计，耗时/Token 等按样本数加权。 */
function aggregateBatchGroup(items) {
  const pass = _sumMetric(items, 'pass');
  const partial = _sumMetric(items, 'partial');
  const fail = _sumMetric(items, 'fail');
  const executed = pass + partial + fail;

  const durations = _weightedMetric(items, 'duration_avg', 'duration_samples');
  const agentDurations = _weightedMetric(items, 'agent_duration_avg', 'agent_duration_samples');
  const rounds = _weightedMetric(items, 'rounds_avg', 'rounds_samples');
  const tools = _weightedMetric(items, 'tool_calls_avg', 'tool_call_samples');
  const tokens = _weightedMetric(items, 'tokens_avg', 'token_samples');

  const p95s = items.map(b => _metricNum(b, 'duration_p95')).filter(v => v !== null);
  const tokenTotals = items.map(b => _metricNum(b, 'tokens_total')).filter(v => v !== null);
  const statusCounts = {};
  for (const b of items) statusCounts[b.status] = (statusCounts[b.status] || 0) + 1;

  return {
    count: items.length,
    subjectCount: new Set(items.map(b => b.sid)).size,
    taskCount: Math.max(0, ...items.map(b => _metricNum(b, 'task_count') || 0)),
    pass, partial, fail, executed,
    strictRate: (pass + fail) ? pass / (pass + fail) : null,
    passRate: executed ? pass / executed : null,
    durations, agentDurations, rounds, tools, tokens,
    p95: p95s.length ? Math.max(...p95s) : null,
    tokensTotal: tokenTotals.length ? tokenTotals.reduce((a, v) => a + v, 0) : null,
    statusCounts,
    latest: Math.max(0, ...items.map(b => {
      const t = new Date(b.create_time).getTime();
      return isNaN(t) ? 0 : t;
    })),
  };
}

function toggleBatchGroup(gid) {
  const open = !_batchGroupOpen.has(gid);
  if (open) _batchGroupOpen.add(gid); else _batchGroupOpen.delete(gid);
  const el = document.getElementById(`batch-group-${gid}`);
  if (!el) return;
  el.classList.toggle('open', open);
  const head = el.querySelector('.batch-group-head');
  if (head) head.setAttribute('aria-expanded', String(open));
  const body = el.querySelector('.batch-group-body');
  if (body) body.style.display = open ? '' : 'none';
}

function expandAllBatchGroups(open) {
  for (const gid of _batchGroupGids) {
    if (open) _batchGroupOpen.add(gid); else _batchGroupOpen.delete(gid);
    const el = document.getElementById(`batch-group-${gid}`);
    if (!el) continue;
    el.classList.toggle('open', open);
    const head = el.querySelector('.batch-group-head');
    if (head) head.setAttribute('aria-expanded', String(open));
    const body = el.querySelector('.batch-group-body');
    if (body) body.style.display = open ? '' : 'none';
  }
}

function _batchGroupHtml(group, subjMap) {
  const open = _batchGroupOpen.has(group.gid);
  const agg = group.agg;
  const statusTags = [0, 1, 2, 3, 4]
    .filter(st => agg.statusCounts[st])
    .map(st => {
      const [txt, cls] = BATCH_STATUS[st] || ['未知', 'tag-gray'];
      return `<span class="tag ${cls}">${txt} ${agg.statusCounts[st]}</span>`;
    }).join('');
  const metrics = [
    _bgMetric('平均通过率', fmtPct(agg.strictRate),
      agg.pass + agg.fail ? `严格口径 · ${fmtInt(agg.pass + agg.fail)} 个结果` : '暂无有效结果',
      'PASS / (PASS + FAIL)，累计组内所有批次的执行结果', _rateClass(agg.strictRate)),
    _bgMetric('含 PARTIAL 通过率', fmtPct(agg.passRate),
      agg.executed ? `计入部分通过 · ${fmtInt(agg.executed)} 个结果` : '暂无已执行结果',
      'PASS / (PASS + PARTIAL + FAIL)，把 PARTIAL（校验通过但 Agent 异常）计入分母'),

async function pageBatches() {
  if (_batchDetailTimer) { clearInterval(_batchDetailTimer); _batchDetailTimer = null; }
  $('#page-title').textContent = '测试批次';
  const [batches, subjects, groups] = await Promise.all([
    api('/api/v1/batches'), api('/api/v1/subjects'), api('/api/v1/groups')]);
  const subjMap = Object.fromEntries(subjects.map(s => [s.id, `${s.name || s.ipaddr + ':' + s.port}`]));
  const groupMap = Object.fromEntries(groups.map(g => [g.id, g.name]));

  // 按任务组归并；组内批次按 id 倒序，组间按最近批次时间倒序
  const buckets = new Map();
  for (const b of batches) {
    if (!buckets.has(b.gid)) buckets.set(b.gid, []);
    buckets.get(b.gid).push(b);
  }
  const groupList = [...buckets.entries()].map(([gid, items]) => {
    items.sort((a, b) => b.id - a.id);
    return {
      gid,
      name: groupMap[gid] || `gid=${gid}`,
      items,
      agg: aggregateBatchGroup(items),
    };
  }).sort((a, b) => b.agg.latest - a.agg.latest);
  _batchGroupGids = groupList.map(g => g.gid);

  $('#content').innerHTML = `
  <div class="card">
    <div class="flex-between">
      <h2>批次列表 <span class="page-sub">${groupList.length} 个任务组 · ${batches.length} 个批次</span></h2>
      <div class="flex">
        <button class="btn btn-default btn-sm" onclick="expandAllBatchGroups(true)">全部展开</button>
        <button class="btn btn-default btn-sm" onclick="expandAllBatchGroups(false)">全部折叠</button>
        <button class="btn" onclick="showBatchModal(${jsArg(subjects, groups)})">+ 创建批次</button>
      </div>
    </div>
    ${groupList.map(g => _batchGroupHtml(g, subjMap)).join('') ||
      '<div style="text-align:center;color:#999;padding:40px 0">暂无批次</div>'}
  </div>`;
}

/**
 * 单独执行批次内的某个任务。
 * 依赖未成功时提示用户确认，确认后忽略依赖强制执行。
 */
async function runBatchTask(tid) {
  const b = _batchDetailData;
  if (!b) return;
  const tasks = b.tasks || [];
  const task = tasks.find(t => t.tid === tid);
  if (!task) return;
  const byTid = Object.fromEntries(tasks.map(t => [t.tid, t]));
  const unmet = (task.depends || []).filter(depTid => byTid[depTid]?.result !== 1);
  let force = false;
  if (unmet.length) {
    const names = unmet.map(d => `#${d}${byTid[d] ? ' ' + byTid[d].name : ''}`).join('、');
    if (!confirm(`任务 #${tid}（${task.name}）的依赖未满足：${names}\n\n是否忽略依赖强制执行？`)) return;
    force = true;
  }
  try {
    await api(`/api/v1/batches/${b.id}/tasks/${tid}/run${force ? '?force=true' : ''}`, { method: 'POST' });
  } catch (e) { toast(e.message, 'error'); return; }
  _batchTaskStartedAt = Date.now();
  toast(force ? `任务 #${tid} 已启动（忽略依赖）` : `任务 #${tid} 已启动`);
  // 等后台创建“执行中”记录后再刷新，随后由自动刷新接管
  setTimeout(() => batchDetail(b.id, b._fromPage || 'batches'), 800);
}

/* ═══════════════════════ 全屏日志查看器 ═══════════════════════ */
let _logViewerTimer = null;
let _logViewerResultId = null;

/**
 * 全屏打开日志查看器。
 * @param {number} resultId - task_result 的 id
 * @param {string} title - 标题
 * @param {boolean} live - 是否实时刷新（默认 true，仅当任务可能还在运行时）
 */
function openLogViewer(resultId, title, live = true) {
  closeLogViewer(); // 先关旧的
  _logViewerResultId = resultId;

  const el = document.createElement('div');
  el.className = 'fullscreen-log';
  el.id = 'fullscreen-log-viewer';
  el.innerHTML = `
    <div class="log-header">
      <div><h3>${esc(title)}</h3><span class="meta" id="log-meta">加载中...</span></div>
      <div class="actions">
        <button class="btn btn-log btn-sm" onclick="refreshLogViewer()">刷新</button>
        <button class="btn btn-log btn-sm" onclick="copyLogContent()">复制</button>
        <button class="btn btn-log btn-sm" onclick="closeLogViewer()">✕ 关闭 (Esc)</button>
      </div>
    </div>
    <div class="log-body"><pre class="log-content" id="log-content">加载中...</pre></div>
    <div class="log-status">
      <span id="log-status-text">${live ? '<span class="live">实时刷新中（每 2 秒）</span>' : '已结束'}</span>
      <span id="log-updated"></span>
    </div>`;
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';

  // Esc 关闭
  el._escHandler = e => { if (e.key === 'Escape') closeLogViewer(); };
  document.addEventListener('keydown', el._escHandler);

  refreshLogViewer();
  if (live) {
    _logViewerTimer = setInterval(refreshLogViewer, 2000);
  }
}

async function refreshLogViewer() {
  if (!_logViewerResultId) return;
  try {
    const r = await api(`/api/v1/results/${_logViewerResultId}`);
    const logEl = $('#log-content');
    const metaEl = $('#log-meta');
    const statusEl = $('#log-status-text');
    const updatedEl = $('#log-updated');
    if (!logEl) return; // 已关闭

    const wasAtBottom = logEl.parentElement.scrollHeight - logEl.parentElement.scrollTop <= logEl.parentElement.clientHeight + 50;
    logEl.textContent = r.process || '（暂无日志）';
    if (wasAtBottom) logEl.parentElement.scrollTop = logEl.parentElement.scrollHeight;

    const [rt, rc] = getResultTag(r.result, r.process);
    metaEl.textContent = `sid=${r.sid} gid=${r.gid} tid=${r.tid} | 结果: ${rt} | 时间: ${new Date(r.create_time).toLocaleString('zh-CN')}`;
    updatedEl.textContent = `更新于 ${new Date().toLocaleTimeString('zh-CN')}`;

    // 任务已结束（1=成功 2=失败）则停止实时刷新；0=未执行 3=执行中 继续刷新
    if (r.result !== 0 && r.result !== 3 && _logViewerTimer) {
      clearInterval(_logViewerTimer);
      _logViewerTimer = null;
      if (statusEl) statusEl.innerHTML = '已结束';
    }
  } catch (e) {
    const logEl = $('#log-content');
    if (logEl) logEl.textContent = `加载失败: ${e.message}`;
  }
}

function copyLogContent() {
  const text = $('#log-content')?.textContent || '';
  navigator.clipboard.writeText(text).then(() => toast('已复制到剪贴板'));
}

function closeLogViewer() {
  if (_logViewerTimer) { clearInterval(_logViewerTimer); _logViewerTimer = null; }
  _logViewerResultId = null;
  const el = $('#fullscreen-log-viewer');
  if (el) {
    document.removeEventListener('keydown', el._escHandler);
    el.remove();
  }
  document.body.style.overflow = '';
}

async function exportBatchCsv(bid) {
  const res = await fetch(`/api/v1/results/export?batch_id=${bid}`, {
    headers: { 'Authorization': `Bearer ${state.token}` },
  });
  if (!res.ok) { toast('导出失败（批次可能没有结果）', 'error'); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `batch_${bid}_results_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV 已下载');
}

      const [txt, cls] = BATCH_STATUS[b.status] || ['未知', 'tag-gray'];
      const m = b.metrics || {};
      return `<tr>
        <td>#${b.id}</td>
        <td class="mono">${esc(subjMap[b.sid] || `sid=${b.sid}`)}</td>
        <td>${esc(groupMap[b.gid] || `gid=${b.gid}`)}</td>
        <td><span class="tag ${cls}">${txt}</span></td>
        <td>${fmtInt(m.task_count)}</td>
        <td><span class="tag tag-green">${fmtInt(m.pass)}</span></td>
        <td><span class="tag tag-orange">${fmtInt(m.partial)}</span></td>
        <td><span class="tag tag-red">${fmtInt(m.fail)}</span></td>
        <td><span class="tag tag-gray">${fmtInt(m.skip)}</span></td>
        <td>${fmtPct(m.strict_pass_rate)}</td>
        <td>${fmtPct(m.pass_rate)}</td>
        <td>${fmtSec(m.duration_avg)}</td>
        <td>${fmtSec(m.duration_p95)}</td>
        <td>${fmtTok(m.tokens_avg)}</td>
        <td>${fmtInt(m.token_samples)}</td>
        <td>${fmtNum(m.rounds_avg)}</td>
        <td>${fmtNum(m.tool_calls_avg)}</td>
        <td class="mono">${new Date(b.create_time).toLocaleString('zh-CN')}</td>
        <td>
          <button class="btn btn-sm btn-default" onclick="navigate('result/${b.id}')">详情</button>
          ${canEdit ? `<button class="btn btn-sm btn-danger" onclick="delBatch(${b.id}, 'results')">删除</button>` : ''}
        </td></tr>`;
    }).join('') || '<tr><td colspan="19" class="empty">暂无批次结果</td></tr>'}
    </tbody></table></div>
  </div>`;
}

/* ═══════════════════════ 工作空间（VS Code 风格）═══════════════════════ */
let _wsGid = null, _wsGname = '', _wsPath = '', _wsFile = null, _wsDirty = false;
let _wsTerm = null, _wsSocket = null, _wsFit = null;

async function openWorkspace(gid, gname) {
  _wsGid = gid; _wsGname = gname; _wsPath = ''; _wsFile = null; _wsDirty = false;
  navigate('workspace/' + gid);
}

function closeWorkspace() {
  if (_wsTerm) { _wsTerm.dispose(); _wsTerm = null; }
  if (_wsSocket) { _wsSocket.close(); _wsSocket = null; }
  _wsFit = null;
  _wsGid = null; _wsGname = ''; _wsPath = ''; _wsFile = null; _wsDirty = false;
}

async function renderWorkspaceFull() {
  document.body.style.overflow = 'hidden';
  // 全屏工作空间：无侧边栏、无 topbar，占满整个视口
  $('#app').innerHTML = `
  <div class="ws-layout" style="height:100vh;border-radius:0">
    <div class="ws-sidebar">
      <div class="ws-side-header">
        <span style="cursor:pointer;color:#569cd6" onclick="goto('groups')" title="返回任务组">← ${esc(_wsGname)}</span>
        <span class="ops">
          <button onclick="wsNewFile()" title="新建文件">📄+</button>
          <button onclick="wsNewDir()" title="新建目录">📁+</button>
          <button onclick="wsLoadTree(_wsPath)" title="刷新">⟳</button>
        </span>
      </div>
      <div class="ws-tree" id="ws-tree"></div>
    </div>
    <div class="ws-main">
      <div class="ws-editor-head">
        <span class="path" id="ws-editor-path">未打开文件</span>
        <span class="flex">
          <button class="btn btn-sm" id="ws-save-btn" style="display:none" onclick="wsSave()">保存 (Ctrl+S)</button>
          ${state.user.privilege >= 1 ? '<button class="btn btn-sm btn-danger" id="ws-del-btn" style="display:none" onclick="wsDeleteFile()">删除</button>' : ''}
          <button class="btn btn-sm btn-default" onclick="goto('groups')">返回列表</button>
        </span>
      </div>
      <div class="ws-welcome" id="ws-welcome">
        <div style="font-size:32px">🗂️</div>
        <div>从左侧选择文件编辑，或在下方终端中操作</div>
        <div style="font-size:12px;color:#444">终端 cwd = workspaces/group_${_wsGid}，python 已指向项目 venv</div>
      </div>
      <div class="ws-editor" id="ws-editor" style="display:none"><textarea id="ws-textarea" spellcheck="false"></textarea></div>
      <div class="ws-terminal-wrap" id="ws-term-wrap">
        <div class="ws-term-header">
          <span>终端 — group-${ _wsGid} (bash)</span>
          <span class="ops">
            <button onclick="wsTermToggle()" id="ws-term-toggle">收起</button>
            <button onclick="wsTermReconnect()">重连</button>
          </span>
        </div>
        <div id="ws-terminal"></div>
      </div>
      <div class="ws-statusbar">
        <span>group_${_wsGid}</span>
        <span id="ws-status-msg"></span>
        <span class="right" id="ws-term-status">终端：连接中...</span>
        <span class="right">venv: <span id="ws-venv-info">加载中...</span></span>
      </div>
    </div>
  </div>`;
  await wsLoadTree();
  wsInitTerminal();

  // Ctrl+S 保存
  document.getElementById('ws-textarea').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); wsSave(); }
  });
  document.getElementById('ws-textarea').addEventListener('input', () => {
    if (!_wsDirty) { _wsDirty = true; wsUpdateHeader(); }
  });
}

async function wsLoadTree(path = '') {
  const r = await api(`/api/v1/groups/${_wsGid}/workspace/files?path=${encodeURIComponent(path)}`);
  _wsPath = r.path;
  const tree = $('#ws-tree');
  let html = '';
  if (r.path) {
    const parent = r.path.split('/').slice(0, -1).join('/');
    html += `<div class="tree-item dir" onclick="wsLoadTree(${jsArg(parent)})"><span class="icon">↩</span>..</div>`;
  }
  html += r.entries.map(e => {
    const icon = e.is_dir ? '📁' : (e.name.endsWith('.py') ? '🐍' : e.name.endsWith('.sh') ? '⚙️' : '📄');
    const size = e.is_dir ? '' : `<span class="size">${fmtSize(e.size)}</span>`;
    const click = e.is_dir ? `wsLoadTree(${jsArg(e.path)})` : `wsOpenFile(${jsArg(e.path)})`;
    const active = _wsFile === e.path ? ' active' : '';
    return `<div class="tree-item${e.is_dir ? ' dir' : ''}${active}" onclick="${click}">
      <span class="icon">${icon}</span>${esc(e.name)}${size}</div>`;
  }).join('');
  tree.innerHTML = html || '<div style="padding:16px;color:#555;font-size:12px">空目录</div>';
}

function fmtSize(n) {
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'K';
  return (n / 1024 / 1024).toFixed(1) + 'M';
}

async function wsOpenFile(path) {
  if (_wsDirty && !confirm('当前文件有未保存的修改，放弃？')) return;
  const r = await api(`/api/v1/groups/${_wsGid}/workspace/file?path=${encodeURIComponent(path)}`);
  _wsFile = r.path; _wsDirty = false;
  $('#ws-welcome').style.display = 'none';
  $('#ws-editor').style.display = 'block';
  $('#ws-textarea').value = r.content;
  $('#ws-save-btn').style.display = state.user.privilege >= 1 ? '' : 'none';
  $('#ws-del-btn') && ($('#ws-del-btn').style.display = '');
  wsUpdateHeader(); wsLoadTree(_wsPath);
}

function wsUpdateHeader() {
  $('#ws-editor-path').innerHTML = esc(_wsFile || '未打开文件') + (_wsDirty ? '<span class="dirty">● 未保存</span>' : '');
}

async function wsSave() {
  if (!_wsFile || !_wsDirty) return;
  await api(`/api/v1/groups/${_wsGid}/workspace/file?path=${encodeURIComponent(_wsFile)}`,
    { method: 'PUT', body: JSON.stringify({ content: $('#ws-textarea').value }) });
  _wsDirty = false; wsUpdateHeader();
  $('#ws-status-msg').textContent = `已保存 ${new Date().toLocaleTimeString('zh-CN')}`;
  wsLoadTree(_wsPath);
}

async function wsNewFile() {
  const name = prompt('新文件名（可含子目录，如 scripts/check.py）:');
  if (!name) return;
  await api(`/api/v1/groups/${_wsGid}/workspace/file?path=${encodeURIComponent(name)}`,
    { method: 'PUT', body: JSON.stringify({ content: '' }) });
  wsLoadTree(_wsPath); wsOpenFile(name);
}

async function wsNewDir() {
  const name = prompt('新目录名（可含多级，如 scripts/lib）:');
  if (!name) return;
  await api(`/api/v1/groups/${_wsGid}/workspace/mkdir`,
    { method: 'POST', body: JSON.stringify({ path: name }) });
  wsLoadTree(_wsPath);
}

async function wsDeleteFile() {
  if (!_wsFile || !confirm(`删除 ${_wsFile}？`)) return;
  await api(`/api/v1/groups/${_wsGid}/workspace/file?path=${encodeURIComponent(_wsFile)}`, { method: 'DELETE' });
  _wsFile = null; _wsDirty = false;
  $('#ws-editor').style.display = 'none';
  $('#ws-welcome').style.display = 'flex';
  $('#ws-save-btn').style.display = 'none';
  $('#ws-del-btn') && ($('#ws-del-btn').style.display = 'none');
  wsUpdateHeader(); wsLoadTree(_wsPath);
}

function wsTermToggle() {
  const w = $('#ws-term-wrap');
  w.classList.toggle('collapsed');
  $('#ws-term-toggle').textContent = w.classList.contains('collapsed') ? '展开' : '收起';
  if (_wsFit && !w.classList.contains('collapsed')) setTimeout(() => _wsFit.fit(), 50);
}

function wsTermReconnect() {
  if (_wsSocket) { _wsSocket.close(); _wsSocket = null; }
  if (_wsTerm) { _wsTerm.clear(); }
  wsInitTerminal();
}

function wsInitTerminal() {
  if (typeof Terminal === 'undefined') {
    $('#ws-terminal').innerHTML = '<div style="color:#f66;padding:20px">xterm.js 加载失败（需要能访问 cdn.jsdelivr.net）</div>';
    return;
  }
  if (_wsTerm) { _wsTerm.dispose(); _wsTerm = null; }
  const term = new Terminal({
    fontSize: 13, fontFamily: '"SF Mono", Consolas, monospace',
    cursorBlink: true, scrollback: 5000,
    theme: { background: '#0c0c0c', foreground: '#d4d4d4' },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($('#ws-terminal'));
  setTimeout(() => { fit.fit(); }, 100);
  _wsTerm = term; _wsFit = fit;

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/api/v1/groups/${_wsGid}/workspace/terminal?token=${encodeURIComponent(state.token)}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    $('#ws-term-status').textContent = '终端：已连接';
    ws.send(JSON.stringify({ type: 'resize', rows: term.rows, cols: term.cols }));
    // 获取 venv python 版本显示在状态栏
    setTimeout(() => {
      if (ws.readyState === 1) ws.send('python --version && which python\n');
    }, 500);
  };
  ws.onmessage = e => {
    if (e.data instanceof ArrayBuffer) term.write(new Uint8Array(e.data));
    else term.write(e.data);
  };
  ws.onclose = () => { $('#ws-term-status').textContent = '终端：已断开'; term.write('\r\n\x1b[31m[连接已断开]\x1b[0m\r\n'); };
  ws.onerror = () => { $('#ws-term-status').textContent = '终端：连接错误'; };
  term.onData(d => { if (ws.readyState === 1) ws.send(d); });
  term.onResize(({ rows, cols }) => {
    if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'resize', rows, cols }));
  });
  // 窗口大小变化时重算终端尺寸
  window.addEventListener('resize', () => { if (_wsFit) _wsFit.fit(); });
  _wsSocket = ws;
}

/* ═══════════════════════ 弹窗 ═══════════════════════ */
function showModal(title, bodyHtml, onOk) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal"><h3>${title}</h3>${bodyHtml}
    <div class="footer">
      <button class="btn btn-default" onclick="this.closest('.modal-mask').remove()">关闭</button>
      ${onOk ? '<button class="btn" id="modal-ok">确定</button>' : ''}
    </div></div>`;
  document.body.appendChild(mask);
  if (onOk) mask.querySelector('#modal-ok').onclick = async () => {
    try { const r = await onOk(); if (r !== false) mask.remove(); }
    catch (e) { toast(e.message, 'error'); }
  };
}

/* ═══════════════════════ 启动 ═══════════════════════ */
window.addEventListener('hashchange', loadRoute);

(async () => {
  if (state.token) {
    try { state.user = await api('/api/v1/auth/me'); }
    catch { state.token = null; }
  }
  if (!state.token) return renderLogin();
  if (!location.hash) history.replaceState(null, '', '#/groups');
  await loadRoute();
})();
</script>
